<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .box h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            gap: 15px;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .feedback {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .feedback h3 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .stars {
            color: #f59e0b;
            font-size: 20px;
            margin: 8px 0;
        }

        .category {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        .delete {
            background: #dc2626;
            width: auto;
            padding: 8px 15px;
            margin-top: 10px;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .success {
            color: green;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>⭐ Feedback Management System</h1>
    <p>Collect and manage customer feedback easily</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="card">
            <h3>Total Feedback</h3>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h3>Average Rating</h3>
            <p id="average">0</p>
        </div>

        <div class="card">
            <h3>Positive Feedback</h3>
            <p id="positive">0</p>
        </div>

    </div>


    <!-- Feedback Form -->
    <div class="box">

        <h2>Submit Feedback</h2>

        <form id="feedbackForm">

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <select id="category" required>

                <option value="">Select Category</option>
                <option value="Product">Product</option>
                <option value="Service">Service</option>
                <option value="Website">Website</option>
                <option value="Support">Support</option>
                <option value="Suggestion">Suggestion</option>

            </select>

            <select id="rating" required>

                <option value="">Select Rating</option>
                <option value="5">★★★★★ - Excellent</option>
                <option value="4">★★★★ - Good</option>
                <option value="3">★★★ - Average</option>
                <option value="2">★★ - Poor</option>
                <option value="1">★ - Very Poor</option>

            </select>

            <textarea
                id="message"
                placeholder="Write your feedback"
                required>
            </textarea>

            <button type="submit">
                Submit Feedback
            </button>

        </form>

        <p id="success" class="success">
            Feedback submitted successfully!
        </p>

    </div>


    <!-- Filter -->
    <div class="box">

        <h2>Feedback List</h2>

        <select id="filter" onchange="displayFeedback()">

            <option value="All">All Categories</option>
            <option value="Product">Product</option>
            <option value="Service">Service</option>
            <option value="Website">Website</option>
            <option value="Support">Support</option>
            <option value="Suggestion">Suggestion</option>

        </select>

        <br><br>

        <div id="feedbackList">
            <p>No feedback available.</p>
        </div>

    </div>

</div>


<script>

    let feedbacks = [];


    // Submit Feedback
    document.getElementById("feedbackForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let feedback = {

                name: document.getElementById("name").value,

                email: document.getElementById("email").value,

                category:
                    document.getElementById("category").value,

                rating:
                    Number(document.getElementById("rating").value),

                message:
                    document.getElementById("message").value

            };


            feedbacks.push(feedback);

            document.getElementById("feedbackForm").reset();

            document.getElementById("success")
                .style.display = "block";

            setTimeout(function() {

                document.getElementById("success")
                    .style.display = "none";

            }, 2000);


            updateDashboard();

        });


    // Update Dashboard
    function updateDashboard() {

        let total = feedbacks.length;

        let ratingTotal = 0;

        let positive = 0;


        feedbacks.forEach(function(feedback) {

            ratingTotal += feedback.rating;

            if (feedback.rating >= 4) {
                positive++;
            }

        });


        let average = total === 0
            ? 0
            : (ratingTotal / total).toFixed(1);


        document.getElementById("total")
            .textContent = total;

        document.getElementById("average")
            .textContent = average;

        document.getElementById("positive")
            .textContent = positive;


        displayFeedback();

    }


    // Display Feedback
    function displayFeedback() {

        let list =
            document.getElementById("feedbackList");

        let filter =
            document.getElementById("filter").value;


        list.innerHTML = "";


        let filtered = feedbacks.filter(function(feedback) {

            return filter === "All" ||
                   feedback.category === filter;

        });


        if (filtered.length === 0) {

            list.innerHTML =
                "<p>No feedback available.</p>";

            return;

        }


        filtered.forEach(function(feedback) {

            let index =
                feedbacks.indexOf(feedback);


            let stars =
                "★".repeat(feedback.rating) +
                "☆".repeat(5 - feedback.rating);


            let div =
                document.createElement("div");

            div.className = "feedback";


            div.innerHTML = `

                <h3>${feedback.name}</h3>

                <p>${feedback.email}</p>

                <div class="stars">
                    ${stars}
                </div>

                <span class="category">
                    ${feedback.category}
                </span>

                <p style="margin-top:12px;">
                    ${feedback.message}
                </p>

                <button
                    class="delete"
                    onclick="deleteFeedback(${index})">
                    Delete
                </button>

            `;


            list.appendChild(div);

        });

    }


    // Delete Feedback
    function deleteFeedback(index) {

        feedbacks.splice(index, 1);

        updateDashboard();

    }

</script>

</body>
</html>
